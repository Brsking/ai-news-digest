# ============ 每日 AI 新闻邮件推送 · 配置 ============
# 普通配置可提交进仓库；密钥（API key / 密码）一律用环境变量，不要写在这里。

schedule:
  timezone_offset: 8        # 时区偏移（中国 = UTC+8）
  send_hour: 8              # 每天本地 8 点发送（改这里即可改时间，不用动 workflow）
  send_minute: 0

email:
  to: "3212923163@qq.com"   # ← 改成你的收件邮箱
  from_name: "AI 每日简报"
  provider: "resend"        # resend（需域名，送达稳）| smtp（Gmail 零成本备选）
  # —— Resend（provider=resend 时生效）——
  resend_api_key: ""        # 从环境变量 RESEND_API_KEY 读取
  resend_from: "ai-news@yourdomain.com"   # ← 改成你的域名邮箱，如 news@xxx.com
  # —— Gmail SMTP（provider=smtp 时生效，零成本备选）——
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  smtp_user: ""             # 从环境变量 SMTP_USER 读取
  smtp_pass: ""             # 从环境变量 SMTP_PASS 读取（Gmail 应用专用密码）

llm:
  enabled: true
  base_url: "https://api.deepseek.com/v1"
  api_key: ""               # 从环境变量 DEEPSEEK_API_KEY 读取
  model: "deepseek-chat"
  # 换模型：例如通义 qwen-plus → base_url 改对应地址、api_key 换通义 key

sources:
  hn:
    enabled: true
    count: 30
    mode: "best"            # top（最新）| best（高票）
  reddit:
    enabled: true
    subreddits: ["MachineLearning", "artificial", "singularity"]
    count: 20
  github:
    enabled: true
    count: 15
    min_stars: 15
    days: 2
  rss_cn:
    enabled: true
    max_per: 8
    feeds:
      - name: "机器之心"
        url: "https://www.jiqizhixin.com/rss"
      - name: "36氪"
        url: "https://36kr.com/feed"
      - name: "量子位"
        url: "https://www.qbitai.com/feed"
  rss_en:
    enabled: true
    max_per: 8
    feeds:
      - name: "TechCrunch AI"
        url: "https://techcrunch.com/category/artificial-intelligence/feed/"
      - name: "MIT Tech Review AI"
        url: "https://www.technologyreview.com/topic/artificial-intelligence/feed"

digest:
  top_n: 14                 # 最终发送条数
  rss_quota: 6             # 其中至少保留多少条 RSS（保证中英文精选覆盖）
