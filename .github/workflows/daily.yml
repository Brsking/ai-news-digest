name: 每日 AI 新闻邮件推送

on:
  # GitHub 免费版 schedule 不稳定，改为每15分钟巡检一次；脚本内部用 .sent_lock
  # 保证每天在北京时间 send_hour 起的窗口内只发一封。
  schedule:
    - cron: "*/15 * * * *"
  # 允许在 GitHub Actions 页面手动点 Run workflow 立即触发（忽略时间检查）。
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 获取今日日期
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: 恢复今日发送锁
        uses: actions/cache@v4
        with:
          path: .sent_lock
          key: sent-${{ steps.date.outputs.today }}
          # 不设置 restore-keys，避免恢复到昨天的锁导致今天漏发

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行推送
        run: python main.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # GitHub 自带 token，用于提高 GitHub 搜索 API 额度
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 手动触发时强制立即发送
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
